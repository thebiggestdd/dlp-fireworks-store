<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DLP Fireworks Store – Product demos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<body>
  <span class="brand">DLP Fireworks Store</span>

    <h1>See how each product works.<br />Tap a video to watch!</h1>
        <section class="gallery">
      <article class="card">
        <div class="video-box">Video goes here</div>
        <p class="name">Product name</p>
        <p class="price">Price here</p>
      </article>
      <article class="card">
        <div class="video-box">Video goes here</div>
        <p class="name">Product name</p>
        <p class="price">Price here</p>
      </article>
      <article class="card">
        <div class="video-box">Video goes here</div>
        <p class="name">Product name</p>
        <p class="price">Price here</p>
      </article>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
